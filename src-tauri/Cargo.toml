[package]
name = "sshvault"
version = "0.28.0"
description = "Zero-knowledge, folder-synced SSH terminal manager and SFTP client"
authors = ["Ali Yousefian"]
license = "MIT"
edition = "2021"

[lib]
name = "sshvault_lib"
# Only the desktop binary links this. "staticlib" and "cdylib" exist for
# iOS/Android builds and would each add a full copy of every dependency.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
des = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Updates from GitHub Releases (release.rs). Same versions and features the
# updater plugin already builds, so these add nothing new to compile.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# No libudev: builds anywhere; ports are still found (sysfs / /dev on Linux).
serialport = { version = "4.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Cryptographic core ---
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# --- Vault / storage ---
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
# OS RNG for ssh-key generation (RSA/ECDSA), which uses rand_core 0.10.
getrandom = { version = "0.4", features = ["sys_rng"] }
# OS credential store for "remember on this device". Pure Rust on Linux
# (Secret Service over zbus), so no libdbus build dependency.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
notify = "8"

# --- Databases ---
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
# PostgreSQL. TLS reuses the rustls + ring already built for the updater and
# MySQL; certificates are checked against the operating system's trust store.
tokio-postgres = "0.7"
futures-util = { version = "0.3", default-features = false }
# SQL Server (D3): TDS over our own socket, TLS through rustls. winauth is NTLM for DOMAIN\user logins.
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
# MongoDB (D7). TLS through rustls + ring, like the rest.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
bson = "2"
# Oracle (D4): a pure-Rust client of Oracle's network protocol, so no Instant Client is needed.
oracle-rs = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
async-trait = "0.1"
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7"

# --- SSH engine ---
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }

# --- Remote desktop (RDP). IronRDP, with TLS through the same rustls + ring ---
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-graphics = "0.9"
ironrdp-pdu = "0.9"
ironrdp-core = "0.2"
ironrdp-input = "0.7"
ironrdp-cliprdr = "0.7"
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
x509-cert = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# NTLM / SSPI sign-in for SQL Server Windows logins (DOMAIN\user), which only exists on Windows.
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

# Line tables keep backtraces readable at a fraction of full debug info,
# and dependencies don't need even that. Cuts the debug build folder,
# which clippy and the tests share, to a fraction of its size.
# Patched copies of three crates RDP needs; see vendor/README.md.
[patch.crates-io]
ironrdp-session = { path = "vendor/ironrdp-session" }
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
