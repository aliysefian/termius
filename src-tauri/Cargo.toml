[package]
name = "sshvault"
version = "0.7.0"
description = "Zero-knowledge, folder-synced SSH terminal manager and SFTP client"
authors = ["Ali Yousefian"]
license = "MIT"
edition = "2021"

[lib]
name = "sshvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# No libudev: builds anywhere; ports are still found (sysfs / /dev on Linux).
serialport = { version = "4.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Cryptographic core ---
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# --- Vault / storage ---
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
# OS RNG for ssh-key generation (RSA/ECDSA), which uses rand_core 0.10.
getrandom = { version = "0.4", features = ["sys_rng"] }
# OS credential store for "remember on this device". Pure Rust on Linux
# (Secret Service over zbus), so no libdbus build dependency.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
notify = "8"

# --- SSH engine ---
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
