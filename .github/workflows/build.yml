name: Build

# Pushes and pull requests run the checks (tests, clippy, type-check).
# Installers are built only for version tags and on demand ("Run workflow"),
# since the optimised release build is most of the time.
on:
  push:
    # Working branches too, so a change is built and linted before anyone opens a pull request.
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
    # Docs-only changes need no build. (Tag pushes ignore path filters.)
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes an in-flight build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships ~25 GB of .NET, Android and Haskell tooling this
      # build never uses; a full Rust build needs the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file \
            openssh-server
          # sshd refuses to start without its privilege-separation dir.
          sudo mkdir -p /run/sshd

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6: version comes from package.json "packageManager"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc # Node 24, the current LTS
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      # Debug-build cache, kept apart from the release one so neither
      # evicts the other; only main saves it, PRs reuse it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The scripts that sign releases are tried with a throw-away key on every push.
      - name: Test the release signing scripts
        if: runner.os == 'Linux'
        run: scripts/test-signing.sh

      # The frontend is the same on every OS; check it once.
      - name: Type-check frontend
        if: runner.os == 'Linux'
        run: pnpm check

      - name: Test frontend
        if: runner.os == 'Linux'
        run: pnpm test

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # On Linux the SSH, SFTP and forwarding tests start a throw-away sshd;
      # on Windows they skip themselves and the rest still run.
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

  # Loads the built app in a real browser under the content security policy from tauri.conf.json and fails on any
  # violation (src/lib/__tests__/e2e/csp.py). Not blocking yet: it has not had a green run on this runner, and
  # should be made blocking (remove continue-on-error) after one.
  csp:
    name: Content security policy
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6: version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc # Node 24, the current LTS
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1
      - run: python -m playwright install --with-deps chromium
      - run: python src/lib/__tests__/e2e/csp.py

  # Installers: for version tags, and on demand from the Actions tab
  # ("Run workflow"). Runs alongside the checks, not after them.
  bundle:
    name: Installers (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Oldest supported Ubuntu keeps the AppImage/deb glibc floor low.
            os: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - name: Windows
            os: windows-latest
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/windows-signature.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships ~25 GB of .NET, Android and Haskell tooling this
      # build never uses; a full Rust build needs the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file \
            openssh-server
          # sshd refuses to start without its privilege-separation dir.
          sudo mkdir -p /run/sshd

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6: version comes from package.json "packageManager"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc # Node 24, the current LTS
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Code signing switches on by itself once the secrets are added (see
      # "Code signing" in docs/DEVELOPMENT.md). Without them, builds are unsigned.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No WINDOWS_CERTIFICATE secret: building unsigned installers."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:RUNNER_TEMP "tauri.signing.json"
          Set-Content -Path $path -Value $config
          "SIGN_CONFIG=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Self-update switches on by itself once the signing secrets exist (see
      # "Updates" in docs/DEVELOPMENT.md). Without them, builds don't update themselves.
      - name: Prepare update signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$UPDATER_PUBKEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY secret or TAURI_UPDATER_PUBKEY variable: building without self-update."
            exit 0
          fi
          path="$RUNNER_TEMP/tauri.updater.json"
          python3 - "$path" <<'PY'
          import json, os, sys
          json.dump({
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": os.environ["UPDATER_PUBKEY"].strip(),
                  "endpoints": [os.environ["UPDATER_ENDPOINT"]],
              }},
          }, open(sys.argv[1], "w"))
          PY
          echo "UPDATER_CONFIG=$path" >> "$GITHUB_ENV"

      - name: Disk space before the release build
        shell: bash
        run: df -h . 2>/dev/null || true

      - name: Build app bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (fetched fresh by the AppImage bundler) ships an old
          # `strip` that fails on binaries from newer toolchains; the release
          # profile already strips what matters.
          NO_STRIP: "true"
        # --verbose shows linuxdeploy's own output if AppImage bundling fails.
        run: pnpm tauri build --verbose ${SIGN_CONFIG:+--config "$SIGN_CONFIG"} ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"}

      # When the build was told to sign, an installer that is not validly signed fails the build, instead of
      # shipping with a warning. Whether it was signed is written down for the release notes.
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "src-tauri/target/release/bundle/windows-signature.txt"
          if (-not $env:SIGN_CONFIG) {
            Set-Content -Path $out -Value "unsigned"
            Write-Output "Built without a signing certificate: nothing to verify."
            exit 0
          }
          $bad = 0
          $subject = ""
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.msi, *-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Output "$($_.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { $bad = 1 } else { $subject = $sig.SignerCertificate.Subject }
          }
          if ($bad -ne 0) { Write-Error "An installer is not validly signed."; exit 1 }
          Set-Content -Path $out -Value "Valid: $subject"

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sshvault-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14

  # On a v* tag, publish a GitHub Release with every installer, once the
  # checks and both platforms' builds have passed.
  release:
    name: Release
    needs: [checks, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7: for scripts/sign-release.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # The feed installed apps read (plugins.updater.endpoints). Only
      # written when the build produced signed update files.
      - name: Write update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DOWNLOAD_BASE: ${{ vars.UPDATER_DOWNLOAD_BASE }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, pathlib
          tag = os.environ["TAG"]
          base = (os.environ.get("DOWNLOAD_BASE") or f"https://github.com/{os.environ['REPO']}/releases/download/{tag}").rstrip("/")
          kinds = [
              ("*.AppImage.sig", ["linux-x86_64"]),
              ("*-setup.exe.sig", ["windows-x86_64", "windows-x86_64-nsis"]),
              ("*.msi.sig", ["windows-x86_64-msi"]),
          ]
          platforms = {}
          for pattern, keys in kinds:
              for sig in glob.glob(f"dist/**/{pattern}", recursive=True):
                  artifact = pathlib.Path(sig[: -len(".sig")]).name
                  entry = {"signature": pathlib.Path(sig).read_text().strip(), "url": f"{base}/{artifact}"}
                  for k in keys:
                      platforms.setdefault(k, entry)
          if not platforms:
              print("No .sig files: this release has no update manifest.")
              raise SystemExit(0)
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{os.environ['REPO']}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      # Published automatically, so never publish a partial release.
      - name: Check every installer is present
        run: |
          missing=0
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.msi' '*-setup.exe'; do
            if ! find dist -name "$pattern" | grep -q .; then
              echo "::error::No $pattern installer was built"
              missing=1
            fi
          done
          find dist -type f -printf '%f  %s bytes\n' | sort
          exit $missing

      # Signed with GPG once the key is added (see docs/SIGNING.md); without it the release is as before.
      - name: Sign installers and checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret: this release is not GPG-signed."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::The GPG key could not be read"; exit 1; }
          GPG_KEY_ID="$fpr" scripts/sign-release.sh dist
          gpg --batch --armor --export "$fpr" > dist/sshvault-release.asc
          # The check a downloader does, run here too: a release that does not verify is not published.
          mkdir flat && find dist -type f -exec cp {} flat/ \;
          scripts/verify-release.sh flat flat/sshvault-release.asc
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"

      - name: Write download instructions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          file() { find dist -name "$1" -printf '%f\n' | head -1; }
          {
            echo "## Download"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows (installer) | \`$(file '*-setup.exe')\` |"
            echo "| Windows (MSI, for managed installs) | \`$(file '*.msi')\` |"
            echo "| Debian, Ubuntu, Mint, Pop!_OS | \`$(file '*.deb')\` |"
            echo "| Fedora, RHEL, openSUSE | \`$(file '*.rpm')\` |"
            echo "| Any Linux (no install, updates itself) | \`$(file '*.AppImage')\` |"
            echo
            win=$(cat "$(find dist -name windows-signature.txt | head -1)" 2>/dev/null || echo unsigned)
            rm -f dist/*/windows-signature.txt dist/windows-signature.txt
            case "$win" in
              Valid:*) echo "The Windows installers are signed with Authenticode (${win#Valid: })." ;;
              *) echo "The Windows installers aren't code-signed yet, so SmartScreen may warn on first launch: choose **More info → Run anyway**." ;;
            esac
            if [ -n "${GPG_FPR:-}" ]; then
              echo "Every installer also has a GPG signature (\`.asc\`), and \`SHA256SUMS\` is signed too. The key is \`sshvault-release.asc\`, fingerprint \`${GPG_FPR}\`. Check with \`scripts/verify-release.sh\` (see docs/SIGNING.md)."
            else
              echo "The Linux packages aren't GPG-signed yet."
            fi
            echo "For the AppImage: \`chmod +x SSHVault_${v}_amd64.AppImage\` and run it."
            echo
            echo "\`.sig\` files and \`latest.json\` (if present) are for automatic updates; you don't need to download them."
            echo
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          make_latest: true
          body_path: release-body.md
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: true
