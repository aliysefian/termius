name: Dependency audit

# Reports known vulnerabilities in the Rust and JavaScript dependencies. This workflow is separate from the build, so a
# failing run never blocks a release; it is the signal that a dependency has a new advisory. The one known Rust finding
# is recorded with its reason in src-tauri/.cargo/audit.toml, so a failure here means something new.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths: ["src-tauri/Cargo.lock", "pnpm-lock.yaml", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        working-directory: src-tauri
        run: cargo audit

  js:
    name: pnpm audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6: version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc # Node 24, the current LTS
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
