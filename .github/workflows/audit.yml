name: Dependency audit

# Reports known vulnerabilities in the Rust and JavaScript dependencies. It does not block builds: a finding
# opens a failing run to look at, and it is made blocking once the current findings are triaged.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths: ["src-tauri/Cargo.lock", "pnpm-lock.yaml", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo audit
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        working-directory: src-tauri
        run: cargo audit

  js:
    name: pnpm audit
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
